<div class="field">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  <div class="input-row{% if field.errors %} invalid{% endif %}">
    {{ field }}
    {% if toggle %}<button class="password-toggle" type="button" data-password-toggle="{{ field.id_for_label }}" aria-controls="{{ field.id_for_label }}" aria-pressed="false" hidden>Show</button>{% endif %}
  </div>
  {% if field.help_text %}<div class="help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
  {% if field.errors %}<div class="field-errors" id="{{ field.auto_id }}_error" role="alert">{{ field.errors }}</div>{% endif %}
</div>
