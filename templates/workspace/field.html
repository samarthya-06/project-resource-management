<div class="field{% if field.field.widget.input_type == 'checkbox' %} checkbox-field{% endif %}">
{% if field.field.widget.input_type == 'checkbox' %}<div class="check-row">{{ field }}<label for="{{ field.id_for_label }}">{{ field.label }}</label></div>{% else %}
<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span>{% endif %}</label>
<div class="input-row{% if field.errors %} invalid{% endif %}">{{ field }}</div>{% endif %}
{% if field.help_text %}<div class="help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
{% if field.errors %}<div class="field-errors" id="{{ field.auto_id }}_error">{{ field.errors }}</div>{% endif %}</div>
