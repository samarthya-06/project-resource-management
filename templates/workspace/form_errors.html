{% if form.errors %}<div class="notice error error-summary" role="alert" tabindex="-1" data-error-summary><p>Your changes could not be saved. Check the following:</p><ul>{% for field in form %}{% if field.errors %}<li><a href="#{{ field.id_for_label }}">{{ field.label }}: {{ field.errors|striptags }}</a></li>{% endif %}{% endfor %}{% for error in form.non_field_errors %}<li>{{ error }}</li>{% endfor %}</ul></div>{% endif %}
