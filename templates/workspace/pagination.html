{% if page.has_other_pages %}<nav class="pagination" aria-label="Pagination">{% if page.has_previous %}<a href="?{% if filter_query %}{{ filter_query }}{% else %}q={{ q|urlencode }}&amp;status={{ status_filter|urlencode }}{% endif %}&amp;page={{ page.previous_page_number }}">Previous</a>{% endif %}<span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?{% if filter_query %}{{ filter_query }}{% else %}q={{ q|urlencode }}&amp;status={{ status_filter|urlencode }}{% endif %}&amp;page={{ page.next_page_number }}">Next</a>{% endif %}</nav>{% endif %}
